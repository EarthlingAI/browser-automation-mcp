<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Earthling Browser Bridge - Connect</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap");

      :root {
        --brand-gradient: linear-gradient(
          120deg,
          #f86a61 0%,
          #d5477e 40%,
          #9946a6 60%,
          #4d51fc 100%
        );
        --bg: #000000;
        --surface: #0d0e14;
        --text: #f1f3f5;
        --text-muted: #ced4da;
        --text-secondary: #868e96;
        --success: #20c997;
        --error: #e03131;
        --border: #181f2b;
        --border-subtle: #101010;
        --primary-500: #e0658f;
        --primary-600: #d5477e;
        --font-body:
          "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --font-mono: "JetBrains Mono", "Fira Code", "Cascadia Code", monospace;
        --radius-sm: 12px;
        --radius-md: 20px;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes fadeSlideUp {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.6;
        }
      }

      body {
        margin: 0;
        padding: 20px;
        font-family: var(--font-body);
        background: var(--bg);
        color: var(--text);
        min-width: 420px;
        display: flex;
        flex-direction: column;
        align-items: center;
        animation: fadeIn 0.4s ease-out;
      }

      .container {
        max-width: 480px;
        width: 100%;
        padding: 28px 24px;
      }

      .header {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        margin-bottom: 28px;
        animation: fadeSlideUp 0.5s ease-out;
      }

      .header img {
        width: 32px;
        height: 32px;
      }

      .header h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 700;
        background: var(--brand-gradient);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .subtitle {
        margin: 0;
        font-size: 13px;
        color: var(--text-secondary);
        font-weight: 400;
      }

      .banner {
        padding: 12px 16px;
        border-radius: var(--radius-sm);
        margin-bottom: 16px;
        font-size: 14px;
        display: none;
        text-align: center;
        animation: fadeSlideUp 0.4s ease-out;
      }

      .banner.connecting {
        display: block;
        background: rgba(213, 71, 126, 0.1);
        border: 1px solid var(--primary-600);
        color: var(--primary-500);
      }

      .banner.connected {
        display: block;
        background: rgba(32, 201, 151, 0.1);
        border: 1px solid var(--success);
        color: var(--success);
      }

      .banner.error {
        display: block;
        background: rgba(224, 49, 49, 0.1);
        border: 1px solid var(--error);
        color: var(--error);
      }

      .banner a {
        color: var(--primary-500);
        text-decoration: underline;
      }

      .client-info {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 12px 16px;
        margin-bottom: 16px;
        font-size: 13px;
        color: var(--text-muted);
        animation: fadeSlideUp 0.5s ease-out 0.1s both;
      }

      .client-info strong {
        color: var(--text);
      }

      .tab-list {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .tab-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 16px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        margin-bottom: 8px;
        transition:
          border-color 0.2s,
          transform 0.2s,
          box-shadow 0.2s;
        animation: fadeSlideUp 0.4s ease-out both;
      }

      .tab-item:nth-child(1) {
        animation-delay: 0.05s;
      }
      .tab-item:nth-child(2) {
        animation-delay: 0.1s;
      }
      .tab-item:nth-child(3) {
        animation-delay: 0.15s;
      }
      .tab-item:nth-child(4) {
        animation-delay: 0.2s;
      }
      .tab-item:nth-child(5) {
        animation-delay: 0.25s;
      }

      .tab-item:hover {
        border-color: var(--primary-500);
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(224, 101, 143, 0.1);
      }

      .tab-favicon {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
        border-radius: 2px;
      }

      .tab-details {
        flex: 1;
        min-width: 0;
        overflow: hidden;
      }

      .tab-title {
        font-size: 14px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .tab-url {
        font-size: 11px;
        color: var(--text-secondary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .btn {
        padding: 8px 20px;
        border: none;
        border-radius: var(--radius-sm);
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        transition:
          transform 0.15s,
          opacity 0.15s,
          box-shadow 0.15s;
        flex-shrink: 0;
      }

      .btn:hover {
        transform: scale(1.02);
      }

      .btn:active {
        transform: scale(0.98);
      }

      .btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
        transform: none;
      }

      .btn-connect {
        background: var(--brand-gradient);
        color: #fff;
        box-shadow: 0 2px 12px rgba(213, 71, 126, 0.3);
      }

      .btn-connect:hover {
        box-shadow: 0 4px 16px rgba(213, 71, 126, 0.4);
      }

      .btn-reject {
        background: transparent;
        border: 1px solid rgba(224, 49, 49, 0.4);
        color: var(--error);
      }

      .btn-reject:hover {
        background: rgba(224, 49, 49, 0.08);
      }

      .actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 16px;
      }

      .section-label {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1px;
        font-weight: 600;
        color: var(--text-secondary);
        margin-bottom: 10px;
        text-align: center;
      }

      #tab-section {
        display: none;
      }

      .spinner {
        display: inline-block;
        width: 14px;
        height: 14px;
        border: 2px solid transparent;
        border-top-color: currentColor;
        border-radius: 50%;
        animation: spin 0.6s linear infinite;
        vertical-align: middle;
        margin-right: 6px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <img src="icons/icon-32.png" alt="Earthling" />
        <h1>Browser Bridge</h1>
        <p class="subtitle">Connect your browser to Earthling</p>
      </div>

      <div id="banner" class="banner"></div>

      <div id="client-info" class="client-info" style="display: none"></div>

      <div id="tab-section">
        <div class="section-label">Choose a Tab</div>
        <ul id="tab-list" class="tab-list"></ul>
      </div>

      <div class="actions">
        <button id="reject-btn" class="btn btn-reject" style="display: none">
          Reject
        </button>
      </div>
    </div>

    <script src="connect.js"></script>
  </body>
</html>
